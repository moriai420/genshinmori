<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原神のモリ - genshin no mori </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <b>原神のモリ - genshin no mori</b>
  <form id="uidForm">
    <label for="uid">UID</label>
    <input id="uid" inputmode="numeric" maxlength="10" placeholder="123456789" required>
    <button class="ch pink" type="submit">⟳ Sincronizza</button>
  </form>
</header>
<div class="stripe"></div>
<main>
  <p id="msg" class="msg">Inserisci il tuo UID per caricare la vetrina. Assicurati che i dettagli dei personaggi siano pubblici su Enka.Network.</p>
  <div id="filters" class="filters"></div>
  <section id="roster" class="grid"></section>
  <section id="sheet" hidden></section>
</main>
<div id="weaponModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="weaponTitle">
  <div class="modalbox bx">
    <button id="closeWeapon" class="ch close" type="button">✕</button>
    <div id="weaponContent"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
